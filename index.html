<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D23B38" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100F" media="(prefers-color-scheme: dark)" />
    <title>BusLinker — Otobüs Bileti</title>
    <meta
      name="description"
      content="Türkiye'nin dört bir yanına otobüs bileti. Sefer karşılaştır, koltuğunu seç, güvenle satın al."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&family=Inter:opsz,wght@14..32,100..900&display=swap"
    />
    <script>
      // Applies the stored theme before first paint so there is no flash.
      try {
        const stored = localStorage.getItem('bl-theme')
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        /* private mode / blocked storage — fall through to the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
